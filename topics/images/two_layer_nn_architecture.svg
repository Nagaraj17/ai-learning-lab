<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 12px; }
      .layer-in { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 10px; }
      .layer-hidden { fill: #1e293b; stroke: #a855f7; stroke-width: 2; rx: 10px; }
      .layer-out { fill: #1e293b; stroke: #22c55e; stroke-width: 2; rx: 10px; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: bold; fill: #f8fafc; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .node-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #f8fafc; }
      .sub-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #cbd5e1; }
      .code-highlight { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #38bdf8; }
      .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
      .weight-tag { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #f59e0b; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <text x="460" y="40" text-anchor="middle" class="title">2-Layer Neural Network Architecture</text>
  <text x="460" y="65" text-anchor="middle" class="subtitle">Next-Word Predictor in 01_Next_Word_Predictor.ipynb</text>

  <!-- Input Layer -->
  <rect x="40" y="110" width="220" height="320" class="layer-in" />
  <text x="150" y="140" text-anchor="middle" class="node-text" fill="#38bdf8">INPUT LAYER</text>
  <text x="150" y="165" text-anchor="middle" class="sub-text">One-Hot Vector x</text>
  <text x="150" y="185" text-anchor="middle" class="sub-text">Shape: (1, 10)</text>

  <rect x="60" y="210" width="180" height="190" fill="#0f172a" stroke="#0284c7" rx="6" />
  <text x="150" y="240" text-anchor="middle" class="sub-text" fill="#38bdf8">'Order' -> 0</text>
  <text x="150" y="270" text-anchor="middle" class="code-highlight">[1, 0, 0, 0, 0,</text>
  <text x="150" y="295" text-anchor="middle" class="code-highlight"> 0, 0, 0, 0, 0]</text>
  <text x="150" y="340" text-anchor="middle" class="sub-text">Vocab Size = 10</text>

  <!-- Arrow 1 with W1, b1 -->
  <line x1="260" y1="270" x2="330" y2="270" class="arrow" />
  <rect x="268" y="225" width="55" height="35" fill="#1e1b4b" stroke="#f59e0b" rx="4" />
  <text x="295" y="247" text-anchor="middle" class="weight-tag">W1, b1</text>

  <!-- Layer 1: Hidden Layer -->
  <rect x="330" y="110" width="250" height="320" class="layer-hidden" />
  <text x="455" y="140" text-anchor="middle" class="node-text" fill="#c084fc">LAYER 1: HIDDEN LAYER</text>
  <text x="455" y="165" text-anchor="middle" class="sub-text">Dense Features (Embedding)</text>
  <text x="455" y="185" text-anchor="middle" class="sub-text">Hidden Size = 8</text>

  <rect x="350" y="210" width="210" height="190" fill="#0f172a" stroke="#7e22ce" rx="6" />
  <text x="455" y="235" text-anchor="middle" class="code-highlight">z1 = np.dot(x, W1) + b1</text>
  <text x="455" y="260" text-anchor="middle" class="sub-text">Shape: (1, 8)</text>
  <line x1="365" y1="275" x2="545" y2="275" stroke="#475569" stroke-dasharray="3,3" />
  <text x="455" y="305" text-anchor="middle" class="code-highlight">hidden = np.tanh(z1)</text>
  <text x="455" y="330" text-anchor="middle" class="sub-text">Squeezes values between</text>
  <text x="455" y="350" text-anchor="middle" class="sub-text">-1.0 and +1.0</text>

  <!-- Arrow 2 with W2, b2 -->
  <line x1="580" y1="270" x2="650" y2="270" class="arrow" />
  <rect x="588" y="225" width="55" height="35" fill="#1e1b4b" stroke="#f59e0b" rx="4" />
  <text x="615" y="247" text-anchor="middle" class="weight-tag">W2, b2</text>

  <!-- Layer 2: Output Layer -->
  <rect x="650" y="110" width="230" height="320" class="layer-out" />
  <text x="765" y="140" text-anchor="middle" class="node-text" fill="#4ade80">LAYER 2: OUTPUT LAYER</text>
  <text x="765" y="165" text-anchor="middle" class="sub-text">Final Prediction Scores</text>
  <text x="765" y="185" text-anchor="middle" class="sub-text">Shape: (1, 10)</text>

  <rect x="670" y="210" width="190" height="190" fill="#0f172a" stroke="#15803d" rx="6" />
  <text x="765" y="235" text-anchor="middle" class="code-highlight">logits = dot(h, W2) + b2</text>
  <text x="765" y="260" text-anchor="middle" class="sub-text">Raw word scores</text>
  <line x1="685" y1="275" x2="845" y2="275" stroke="#475569" stroke-dasharray="3,3" />
  <text x="765" y="305" text-anchor="middle" class="code-highlight">probs = softmax(logits)</text>
  <text x="765" y="330" text-anchor="middle" class="sub-text">Highest Prob: 'Shipment'</text>
  <text x="765" y="350" text-anchor="middle" class="sub-text" fill="#4ade80">Predicted Word 🎉</text>
</svg>
