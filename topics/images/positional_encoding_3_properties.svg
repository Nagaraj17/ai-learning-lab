<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <rect width="900" height="400" fill="#0f172a" rx="12"/>
  
  <!-- Title -->
  <text x="450" y="35" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    3 Key Properties of Sinusoidal Positional Encoding
  </text>
  
  <!-- PANEL 1: Bounded Values -->
  <g transform="translate(25, 55)">
    <rect width="270" height="320" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1.5"/>
    <text x="135" y="30" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      1. Bounded (-1.0 to +1.0)
    </text>
    
    <!-- Axes -->
    <line x1="30" y1="160" x2="250" y2="160" stroke="#475569" stroke-width="1.5"/>
    <line x1="40" y1="50" x2="40" y2="270" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Bounds lines -->
    <line x1="30" y1="100" x2="250" y2="100" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1"/>
    <line x1="30" y1="220" x2="250" y2="220" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="25" y="104" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="end">+1.0</text>
    <text x="25" y="224" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="end">-1.0</text>
    
    <!-- Exploding Red Line -->
    <path d="M 40 160 Q 150 140 240 55" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-dasharray="4,4"/>
    <text x="180" y="70" fill="#ef4444" font-family="sans-serif" font-size="10" font-weight="bold">Exploding Raw ID!</text>
    
    <!-- Smooth Sine Wave -->
    <path d="M 40 160 Q 75 100 110 160 T 180 160 T 250 160" stroke="#38bdf8" stroke-width="3" fill="none"/>
    
    <text x="135" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">
      Never drowns out word embeddings
    </text>
  </g>
  
  <!-- PANEL 2: Extrapolation -->
  <g transform="translate(315, 55)">
    <rect width="270" height="320" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1.5"/>
    <text x="135" y="30" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      2. Extrapolates to Unseen Lengths
    </text>
    
    <!-- Axes -->
    <line x1="30" y1="160" x2="250" y2="160" stroke="#475569" stroke-width="1.5"/>
    <line x1="140" y1="50" x2="140" y2="270" stroke="#ef4444" stroke-dasharray="4,4" stroke-width="1.5"/>
    
    <!-- Wave Train -->
    <path d="M 30 160 Q 60 100 90 160 T 140 160" stroke="#34d399" stroke-width="3" fill="none"/>
    <!-- Wave Extrapolated -->
    <path d="M 140 160 Q 170 100 200 160 T 250 160" stroke="#fbbf24" stroke-width="3" fill="none"/>
    
    <text x="85" y="190" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold">Trained (0-512)</text>
    <text x="195" y="190" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold">Unseen (512-1000)</text>
    
    <text x="135" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">
      Seamless wave past training limit
    </text>
  </g>
  
  <!-- PANEL 3: Relative Distance -->
  <g transform="translate(605, 55)">
    <rect width="270" height="320" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1.5"/>
    <text x="135" y="30" fill="#f472b6" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      3. Relative Distance (&Delta;k)
    </text>
    
    <!-- Circle -->
    <circle cx="135" cy="160" r="75" stroke="#475569" stroke-dasharray="3,3" fill="none" stroke-width="1.5"/>
    
    <!-- Center -->
    <circle cx="135" cy="160" r="3" fill="#cbd5e1"/>
    
    <!-- Vector 1 (pos i) -->
    <line x1="135" y1="160" x2="195" y2="120" stroke="#f472b6" stroke-width="2.5"/>
    <circle cx="195" cy="120" r="4" fill="#f472b6"/>
    <text x="205" y="120" fill="#f472b6" font-family="sans-serif" font-size="10" font-weight="bold">Pos i</text>
    
    <!-- Vector 2 (pos i + k) -->
    <line x1="135" y1="160" x2="100" y2="90" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="100" cy="90" r="4" fill="#a78bfa"/>
    <text x="70" y="85" fill="#a78bfa" font-family="sans-serif" font-size="10" font-weight="bold">Pos i+k</text>
    
    <!-- Arc for Delta k -->
    <path d="M 165 140 A 35 35 0 0 0 118 125" fill="none" stroke="#fb7185" stroke-width="2"/>
    <text x="145" y="125" fill="#fb7185" font-family="sans-serif" font-size="11" font-weight="bold">&Delta;k</text>
    
    <text x="135" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">
      Linear rotation computes distance
    </text>
  </g>
</svg>
